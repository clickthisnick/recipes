<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiration calculator | Recipes</title>
    <link rel="stylesheet" href="./src/site.css">
</head>
<body>
    <a class="skip-link visually-hidden" href="#content">Skip to content</a>
    <main id="content">
        <h1>Expiration calculator</h1>
        <p>Today: <time id="today"></time></p>
        <p id="expiration-status" class="status visually-hidden" role="status" aria-live="polite"></p>
        <div class="table-wrap" tabindex="0" role="region" aria-labelledby="expiration-caption">
            <table>
                <caption id="expiration-caption">Days until these items expire</caption>
                <thead>
                    <tr>
                        <th scope="col">Item</th>
                        <th scope="col">Days to expire</th>
                        <th scope="col">Expiration date</th>
                        <th scope="col">Used</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">Mushrooms</th>
                        <td>3</td>
                        <td data-expiration-days="3"></td>
                        <td><input id="used-mushrooms" data-testid="used-mushrooms" type="checkbox"> <label for="used-mushrooms">Used<span class="visually-hidden"> Mushrooms</span></label></td>
                    </tr>
                    <tr>
                        <th scope="row">Sausage</th>
                        <td>3</td>
                        <td data-expiration-days="3"></td>
                        <td><input id="used-sausage" data-testid="used-sausage" type="checkbox"> <label for="used-sausage">Used<span class="visually-hidden"> Sausage</span></label></td>
                    </tr>
                    <tr>
                        <th scope="row">Carrot</th>
                        <td>7</td>
                        <td data-expiration-days="7"></td>
                        <td><input id="used-carrot" data-testid="used-carrot" type="checkbox"> <label for="used-carrot">Used<span class="visually-hidden"> Carrot</span></label></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script type="module">
        import { addCalendarDays, bindRowCheckboxes, formatUsDate, isoDate } from './src/site-logic.js';

        const today = new Date();
        const todayEl = document.getElementById('today');
        todayEl.textContent = formatUsDate(today);
        todayEl.dateTime = isoDate(today);

        for (const cell of document.querySelectorAll('[data-expiration-days]')) {
            const days = Number(cell.getAttribute('data-expiration-days'));
            cell.textContent = formatUsDate(addCalendarDays(today, days));
        }

        bindRowCheckboxes(document.getElementById('expiration-status'), 'marked used', 'marked still in the fridge');
    </script>
</body>
</html>
