<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light" />
        <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'" />
        <title>Pull cord slicer amount | Recipes</title>
        <link rel="stylesheet" href="./src/site.css" />
    </head>
    <body>
        <a class="skip-link visually-hidden" href="#content">Skip to content</a>
        <main id="content">
            <h1>Cord slicer chart</h1>
            <div class="table-wrap" tabindex="0" role="region" aria-labelledby="cord-caption">
                <table>
                    <caption id="cord-caption">
                        Slice counts
                    </caption>
                    <thead>
                        <tr>
                            <th scope="col">Item</th>
                            <th scope="col">Slice amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="band">
                            <th scope="row">Onion</th>
                            <td></td>
                        </tr>
                        <tr class="band">
                            <th scope="row">Rustic Slices</th>
                            <td>1</td>
                        </tr>
                        <tr class="band">
                            <th scope="row">Stir Fry</th>
                            <td>3</td>
                        </tr>
                        <tr class="band">
                            <th scope="row">Taco</th>
                            <td>3</td>
                        </tr>
                        <tr class="band">
                            <th scope="row">Sauce/Stew</th>
                            <td>5</td>
                        </tr>
                        <tr class="band-warm">
                            <th scope="row">Thai Pepper</th>
                            <td></td>
                        </tr>
                        <tr class="band-warm">
                            <th scope="row">Stir Fry (Large Pieces)</th>
                            <td>5</td>
                        </tr>
                        <tr class="band-warm">
                            <th scope="row">Salsa</th>
                            <td>10</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <script type="module">
            import { readTableTool, registerAgentTools } from './src/site-logic.js';
            registerAgentTools([
                readTableTool('read-slice-amounts', 'Read the cord slicer slice counts shown on this chart.', {
                    row: 'tbody tr',
                    require: 'slices',
                    columns: { item: { selector: 'th' }, slices: { selector: 'td' } },
                }),
            ]);
        </script>
    </body>
</html>
